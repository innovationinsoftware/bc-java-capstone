spring:
  application:
    name: banking
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${ORACLE_URL:jdbc:oracle:thin:@//localhost:1521/XEPDB1}
    username: ${ORACLE_USER:bankapp}
    password: ${ORACLE_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      # The gvenzl oracle-xe:21-slim image is missing timezone region data.
      # This forces the JDBC driver to use numeric UTC offsets instead of
      # region names, preventing ORA-18716 on TIMESTAMP columns.
      connection-properties: oracle.jdbc.timezoneAsRegion=false

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.dialect: org.hibernate.dialect.OracleDialect
      hibernate.format_sql: true
      # Hibernate 6 defaults to TIMESTAMP WITH TIME ZONE for Instant fields.
      # Our DDL uses plain TIMESTAMP, so we must use NORMALIZE to avoid ORA-18716.
      hibernate.timezone.default_storage: NORMALIZE

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 10
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        linger.ms: 10
        compression.type: lz4

  security:
    oauth2:
      client:
        registration:
          google:
            # The client-id and client-secret stay on the SERVER — never in the browser.
            # This is the BFF pattern: the auth code exchange happens here, not in JS.
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, email, profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          google:
            # Google's published OIDC discovery endpoint. Spring fetches JWKS and
            # token endpoint URLs from here automatically.
            issuer-uri: https://accounts.google.com

  # Session cookie settings. JSESSIONID is HttpOnly by default so JS cannot read it.
  # The SameSite=Lax setting prevents the cookie from being sent on cross-site sub-requests
  # (e.g., image loads) while still allowing top-level navigations (redirects from Google).
  session:
    cookie:
      same-site: lax
      http-only: true
      secure: false   # set to true in production (requires HTTPS)

bank:
  cors:
    allowed-origin: ${SPA_ORIGIN:http://localhost:5173}
  kafka:
    transactions-topic: transactions.completed
  payment-processor:
    base-url: ${PAYMENT_PROCESSOR_URL:http://localhost:8089}
    api-key: ${PAYMENT_PROCESSOR_API_KEY:dev-only-not-secret}
    connect-timeout-ms: 2000
    read-timeout-ms: 10000

server:
  port: 8081

logging:
  level:
    org.springframework.security: INFO
    com.example.banking: DEBUG
