# Optional dev infra: Oracle XE + a WireMock container stubbing the Payment
# Processor. Use only if you don't already have these running locally.
#
#   docker compose up -d oracle wiremock
#
# Oracle XE first boot takes a few minutes — wait for "DATABASE IS READY TO USE"
# in `docker compose logs -f oracle` before running the backend.

services:
  oracle:
    image: gvenzl/oracle-xe:21-slim
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-changeme}
      APP_USER: ${ORACLE_USER:-bankapp}
      APP_USER_PASSWORD: ${ORACLE_PASSWORD:-changeme}
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata

  wiremock:
    image: wiremock/wiremock:3.6.0
    command: ["--port", "8089", "--global-response-templating"]
    ports:
      - "8089:8089"
    volumes:
      - ./wiremock:/home/wiremock

volumes:
  oracle-data:
