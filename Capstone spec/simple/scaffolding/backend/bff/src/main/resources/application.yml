spring:
  application:
    name: bff

  security:
    oauth2:
      client:
        registration:
          mock-auth:
            client-id: ${OAUTH_CLIENT_ID:spa-client}
            client-secret: ${OAUTH_CLIENT_SECRET:spa-secret}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid, profile, email
        provider:
          mock-auth:
            issuer-uri: ${AUTH_SERVER_URL:http://localhost:9000}

bank:
  resource-server:
    base-url: ${RESOURCE_SERVER_URL:http://localhost:8081}

server:
  port: 8080
  # Set the cookie name + flags via Spring Boot's session settings.
  servlet:
    session:
      cookie:
        name: JSESSIONID
        http-only: true
        same-site: lax
        # secure: true  # enable when serving over HTTPS

logging:
  level:
    org.springframework.security: INFO
    com.example.bff: DEBUG
