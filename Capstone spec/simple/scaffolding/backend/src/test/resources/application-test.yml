# Test profile — overrides application.yml so integration tests don't need
# a live Oracle database, Kafka broker, or Google OAuth2 endpoints.
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate.timezone.default_storage: NORMALIZE

  flyway:
    enabled: false

  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers}

  security:
    oauth2:
      client:
        registration:
          google:
            # Placeholder values — OAuth2 client is mocked in tests.
            client-id: test-client-id
            client-secret: test-client-secret
            scope: openid, email, profile
        provider:
          google:
            # Placeholder — Google endpoints are never called in tests.
            issuer-uri: https://accounts.google.com

bank:
  cors:
    allowed-origin: http://localhost:5173
  kafka:
    transactions-topic: transactions.completed
  payment-processor:
    base-url: http://localhost:8089
    api-key: test-key
    connect-timeout-ms: 500
    read-timeout-ms: 1000

logging:
  level:
    org.springframework.security: WARN
    com.example.banking: DEBUG
