spring:
  application:
    name: banking
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${ORACLE_URL:jdbc:oracle:thin:@//localhost:1521/XEPDB1}
    username: ${ORACLE_USER:bankapp}
    password: ${ORACLE_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.dialect: org.hibernate.dialect.OracleDialect
      hibernate.format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 10
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        linger.ms: 10
        compression.type: lz4

  security:
    oauth2:
      resourceserver:
        jwt:
          # Google's published JWKS — Spring Security fetches public keys here.
          jwks-uri: https://www.googleapis.com/oauth2/v3/certs
          issuer-uri: https://accounts.google.com

bank:
  # OAuth client ID registered in Google Cloud Console; used as the JWT 'aud'.
  google-client-id: ${GOOGLE_CLIENT_ID}
  cors:
    allowed-origin: ${SPA_ORIGIN:http://localhost:5173}
  kafka:
    transactions-topic: transactions.completed
  payment-processor:
    base-url: ${PAYMENT_PROCESSOR_URL:http://localhost:8089}
    api-key: ${PAYMENT_PROCESSOR_API_KEY:dev-only-not-secret}
    connect-timeout-ms: 2000
    read-timeout-ms: 10000

server:
  port: 8081

logging:
  level:
    org.springframework.security: INFO
    com.example.banking: DEBUG
